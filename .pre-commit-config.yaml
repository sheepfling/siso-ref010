repos:
  - repo: local
    hooks:
      - id: repository-hygiene
        name: Repository hygiene checks
        entry: python -m tools.repo_hygiene.check_repository_hygiene
        language: python
        additional_dependencies:
          - pydantic>=2.7,<3
        pass_filenames: false
        always_run: true
      - id: markdown-quality
        name: Markdown lint and repository link checks
        entry: python -m tools.repo_hygiene.check_markdown
        language: python
        additional_dependencies:
          - mdrepo>=0.0.1.post0,<0.1
          - rumdl>=0.2.49,<0.3
        types: [markdown]
        pass_filenames: false
        always_run: true
