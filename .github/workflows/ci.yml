name: CI

on:
  pull_request:
  push:
    branches: [ main, "hardening/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python: [ '3.11', '3.15' ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Verify source installation generated the indexed edition bundle
        run: git diff --exit-code -- src/siso_ref010/data/standards/index.json
      - name: Run endpoint tests and build distributions
        run: python -m tools.ci edge

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: python -m pip install -e '.[dev]'
      - name: Verify editable installation generated the indexed edition bundle
        run: git diff --exit-code -- src/siso_ref010/data/standards/index.json
      - name: Run edge-edition XSD and quality checks
        run: python -m tools.ci quality
