name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python: [ '3.11', '3.12', '3.13', '3.14' ]
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Validate and query every bundled edition
        run: python -m tools.check_bundled_standards
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Prepare dependency wheels for offline consumer validation
        run: python -m pip download --only-binary=:all: --dest .wheelhouse 'pydantic>=2.7,<3'
      - run: python -m tools.check_installed dist/dis_entity_types-0.0.1-py3-none-any.whl --wheelhouse .wheelhouse

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validate editions when a matching bundled XSD is available
        run: python -m tools.check_standards_xsd
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pyright
      - name: Test core with coverage
        run: python -m pytest -q --cov=dis_entity_types --cov-report=term-missing --cov-fail-under=98
